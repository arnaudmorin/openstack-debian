name: Build debian packages

on:
  push:
    branches:
      - '20[0-9][0-9].[0-9]'
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Same image as build.sh
    container: debian:trixie
    steps:
      # git must be present before checkout, otherwise actions/checkout
      # downloads a tarball without .git and the version can't be computed
      - name: Install git
        run: apt-get update && apt-get install -y git

      - uses: actions/checkout@v4
        with:
          # Full history is needed: version is based on the number of commits
          fetch-depth: 0

      - name: Build
        run: ./build-in-docker.sh

      - uses: actions/upload-artifact@v4
        with:
          name: debs
          path: openstack-*_all.deb
          if-no-files-found: error

  release:
    # Only publish from release branches, never from pull requests
    if: github.event_name != 'pull_request' && github.ref_type == 'branch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: debs

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(dpkg-deb -f openstack-neutron_*_all.deb Version)
          if gh release view "v$VERSION" >/dev/null 2>&1; then
              echo "Release v$VERSION already exists, skipping"
              exit 0
          fi
          echo "Will do a release v$VERSION with a tag on $GITHUB_SHA ($GITHUB_REF_NAME)"
          gh release create "v$VERSION" --target "$GITHUB_SHA" *.deb
